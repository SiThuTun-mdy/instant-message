spring.application.name=backend
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/im
spring.datasource.username=im
spring.datasource.password=im

# Flyway owns the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# Local development default only; set JWT_SECRET (32+ bytes) anywhere else
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
app.jwt.ttl=12h
app.frontend-origin=http://localhost:5173
