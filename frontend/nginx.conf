# Serves the built app and forwards /api and /ws to the backend,
# the same job the Vite proxy does in development.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8085;
    }

    location /ws {
        proxy_pass http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The default 60s would drop a chat socket whenever nobody types for a minute
        proxy_read_timeout 1h;
    }

    # Client-side routes such as /chat/alice have no file on disk
    location / {
        try_files $uri /index.html;
    }
}
